<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackimi | Refined AI-Native DevTools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-system">
        <div class="perspective-floor"></div>
        <div class="spotlight"></div>
    </div>

    <main class="hero">
        <div class="hero-container">
            <div class="badge-row">
                <span class="mono-label">BUILD_VER_1.0.4</span>
            </div>

            <h1 class="brand-title">Hackimi</h1>

            <p class="hero-tagline">
                AI-Native Development Environment designed for the <br>
                <span>architects of tomorrow.</span>
            </p>

            <div class="hero-actions">
                <a href="https://github.com/hackdeacon/hackimi" class="btn-premium">
                    <span>Explore Project</span>
                    <div class="btn-glow"></div>
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <p class="footer-credits">© 2026 Hackimi — Design for future.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
